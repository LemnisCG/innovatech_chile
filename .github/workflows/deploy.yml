name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ── 1. CI gates ───────────────────────────────────────────────────────────
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  frontend-tests:
    uses: ./.github/workflows/frontend-tests.yml

  # ── 2. Build and push all images to ECR ───────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push project-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/backend/project-service/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/innovatech-project-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push resource-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/backend/resource-service/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/innovatech-resource-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push analytics-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/backend/analytics-service/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/innovatech-analytics-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/backend/api-gateway/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/innovatech-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NEXT_PUBLIC_API_URL se bake en la imagen en build-time
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: app/frontend/frontend-dashboard
          file: app/frontend/frontend-dashboard/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/innovatech-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.EC2_FRONTEND_PUBLIC_IP }}:9000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy DB (solo si cambia docker-compose.db.yml) ───────────────────
  deploy-db:
    name: Deploy Database
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy database via SSM
        run: |
          COMPOSE=$(cat .github/workflows/docker-compose.db.yml | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_DB_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'mkdir -p /home/ec2-user/innovatech',
              'echo $COMPOSE | base64 -d > /home/ec2-user/innovatech/docker-compose.db.yml',
              'cd /home/ec2-user/innovatech && docker-compose -f docker-compose.db.yml up -d',
              'docker image prune -f'
            ]" \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for DB deploy
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_DB_INSTANCE_ID }}"
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_DB_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_DB_INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text

  # ── 4. Deploy Backend ──────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-db]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend via SSM
        run: |
          COMPOSE=$(cat .github/workflows/docker-compose.backend.yml | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'mkdir -p /home/ec2-user/innovatech',
              'echo $COMPOSE | base64 -d > /home/ec2-user/innovatech/docker-compose.backend.yml',
              'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}',
              'cd /home/ec2-user/innovatech && ECR_REGISTRY=${{ env.ECR_REGISTRY }} DB_HOST=${{ secrets.EC2_DB_PRIVATE_IP }} docker-compose -f docker-compose.backend.yml pull',
              'cd /home/ec2-user/innovatech && ECR_REGISTRY=${{ env.ECR_REGISTRY }} DB_HOST=${{ secrets.EC2_DB_PRIVATE_IP }} docker-compose -f docker-compose.backend.yml up -d --remove-orphans',
              'docker image prune -f'
            ]" \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for backend deploy
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}"
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text

  # ── 5. Deploy Frontend ─────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend via SSM
        run: |
          COMPOSE=$(cat .github/workflows/docker-compose.frontend.yml | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_FRONTEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'mkdir -p /home/ec2-user/innovatech',
              'echo $COMPOSE | base64 -d > /home/ec2-user/innovatech/docker-compose.frontend.yml',
              'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}',
              'cd /home/ec2-user/innovatech && ECR_REGISTRY=${{ env.ECR_REGISTRY }} BACKEND_HOST=${{ secrets.EC2_BACKEND_PRIVATE_IP }} docker-compose -f docker-compose.frontend.yml pull',
              'cd /home/ec2-user/innovatech && ECR_REGISTRY=${{ env.ECR_REGISTRY }} BACKEND_HOST=${{ secrets.EC2_BACKEND_PRIVATE_IP }} docker-compose -f docker-compose.frontend.yml up -d --remove-orphans',
              'docker image prune -f'
            ]" \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for frontend deploy
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_FRONTEND_INSTANCE_ID }}"
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_FRONTEND_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_FRONTEND_INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text
