name: Frontend tests

on:
  push:
    branches: [main, development]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-tests.yml'
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend/frontend-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/frontend/frontend-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
