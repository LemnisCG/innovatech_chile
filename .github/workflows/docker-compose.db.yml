services:
  project-db:
    image: postgres:15-alpine
    container_name: innovatech_project_db
    restart: always
    environment:
      POSTGRES_DB: innovatech_projects
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - project_db_data:/var/lib/postgresql/data

  resource-db:
    image: postgres:15-alpine
    container_name: innovatech_resource_db
    restart: always
    environment:
      POSTGRES_DB: innovatech_resources
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - resource_db_data:/var/lib/postgresql/data

  analytics-db:
    image: postgres:15-alpine
    container_name: innovatech_analytics_db
    restart: always
    environment:
      POSTGRES_DB: innovatech_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - analytics_db_data:/var/lib/postgresql/data

volumes:
  project_db_data:
  resource_db_data:
  analytics_db_data:
