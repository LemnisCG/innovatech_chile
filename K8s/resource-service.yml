apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: innovatech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
    spec:
      containers:
      - name: resource-service
        image: 343602460192.dkr.ecr.us-east-1.amazonaws.com/innovatech-resource-service:eks-v1
        env:
        - name: DB_HOST
          value: "resource-db-service"
        - name: DB_PORT
          value: "5432"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: jwt-secret
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: innovatech
spec:
  ports:
  - port: 8082
    targetPort: 8082
  selector:
    app: resource-service
