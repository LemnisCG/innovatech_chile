apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: innovatech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: 343602460192.dkr.ecr.us-east-1.amazonaws.com/innovatech-api-gateway:eks-v1
        env:
        - name: PROJECT_SERVICE_URL
          value: "http://project-service:8081"
        - name: RESOURCE_SERVICE_URL
          value: "http://resource-service:8082"
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:8083"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: jwt-secret
        ports:
        - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: innovatech
spec:
  ports:
  - port: 9000
    targetPort: 9000
  selector:
    app: api-gateway