apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: innovatech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
      - name: project-service
        # Asegúrate de usar la ruta completa de tu ECR
        image: 343602460192.dkr.ecr.us-east-1.amazonaws.com/innovatech-project-service:eks-v1
        env:
        - name: DB_HOST
          value: "project-db-service"
        - name: DB_PORT
          value: "5432"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: innovatech
spec:
  ports:
  - port: 8081
    targetPort: 8081
  selector:
    app: project-service